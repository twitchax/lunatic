[package]
name = "lunatic-control-axum"
version = "0.15.0"
edition = "2021"
description = "TBD"
homepage = "https://lunatic.solutions"
repository = "https://github.com/lunatic-solutions/lunatic/tree/main/crates"
license = "Apache-2.0 OR MIT"

[dependencies]
lunatic-control = { workspace = true }
lunatic-distributed = { workspace = true }

anyhow = { workspace = true }
axum = { version = "0.8", features = ["json", "query", "macros"] }
tower-http = { version = "0.7", features = ["limit"] }
base64-url = "4"
chrono = { version = "0.4.23", default-features = false, features = ["clock", "std"] }
dashmap = { workspace = true }
getrandom = "0.4"
http = "1"
log = { workspace = true }
rcgen = "0.14"
asn1-rs = "0.7"
serde = { workspace = true }
serde_json = "1.0.89"
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time", "fs", "net"] }
uuid = { workspace = true }

[dev-dependencies]
lunatic-process = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
